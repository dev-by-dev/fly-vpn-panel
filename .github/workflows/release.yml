name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build panel
        run: make cross

      - name: Checksums
        run: |
          cp scripts/install.sh bin/install.sh
          cp scripts/uninstall.sh bin/uninstall.sh
          cd bin && sha256sum flypanel-linux-amd64 install.sh uninstall.sh > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/flypanel-linux-amd64
            bin/install.sh
            bin/uninstall.sh
            bin/sha256sums.txt